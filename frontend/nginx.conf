server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Proxy API requests to the backend container
    location /api/ {
        # "backend" matches the service name in docker-compose.yml

        # Proxy this request to the server called backend, on port 8000.
        proxy_pass http://backend:8000;
        # Use HTTP/1.1 when communicating with the backend.
        proxy_http_version 1.1;

        # These two headers ensure that the Upgrade/Connection headers are passed correctly, 
        # which is needed for WebSockets and other modern browser features.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # These headers ensure that the backend gets the correct Host and IP address, 
        # making it think the request is coming directly from the user.
        proxy_set_header Host $http_host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static React files and fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
